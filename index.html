<html lang="en-GB">

<title>Councillion</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout idea: a single-column "public notice" board. Each prompt is a yellow
   council notice pinned to the page; answers come back with a rubber stamp. */
:root{
  --paper:#eef0ea;
  --card:#ffffff;
  --ink:#16213a;
  --muted:#5a6375;
  --line:#cfd4cc;
  --civic:#00703c;
  --civic-ink:#ffffff;
  --notice:#ffdd3c;
  --notice-ink:#1a1a12;
  --alert:#b3261e;
  --t1:#8a93a3; --t2:#2f6fd6; --t3:#00843f; --t4:#c79a00; --t5:#d8641b; --t6:#7b3fc4;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1522; --card:#182134; --ink:#e9edf4; --muted:#9aa4b8; --line:#2a3550;
    --civic:#36c27f; --civic-ink:#06140d; --notice:#e9c63a; --notice-ink:#16140a; --alert:#ff6b5e;
    --t1:#a3adbf; --t2:#6ea2ff; --t3:#36c27f; --t4:#e9c63a; --t5:#ff8a45; --t6:#b48cff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1522; --card:#182134; --ink:#e9edf4; --muted:#9aa4b8; --line:#2a3550;
  --civic:#36c27f; --civic-ink:#06140d; --notice:#e9c63a; --notice-ink:#16140a; --alert:#ff6b5e;
  --t1:#a3adbf; --t2:#6ea2ff; --t3:#36c27f; --t4:#e9c63a; --t5:#ff8a45; --t6:#b48cff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--civic);outline-offset:2px}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:10px}
.logo{font-family:var(--display);font-weight:900;font-stretch:115%;font-size:28px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.crest{width:30px;height:30px;flex:none}
.mast small{font-size:12px;color:var(--muted);text-align:right;line-height:1.3;font-variant-numeric:tabular-nums}
.notice{background:var(--notice);color:var(--notice-ink);border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 24px -14px rgba(0,0,0,.45);overflow:hidden}
.notice-head{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--notice-ink);color:var(--notice);padding:7px 14px;font-family:var(--display);font-weight:800;font-stretch:120%;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.notice-body{padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px}
.notice h2{font-size:clamp(26px,7vw,34px);font-weight:850;font-stretch:90%}
.notice p{margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:15px;font-weight:800;font-stretch:115%;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{border:0;border-radius:4px;padding:14px 18px;font-weight:700;font-size:17px;background:var(--civic);color:var(--civic-ink);display:inline-flex;justify-content:center;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.dark{background:var(--notice-ink);color:var(--notice)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 160px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiers{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:14px}
.chip{display:inline-block;width:14px;height:14px;border-radius:3px}
.num{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.timer{height:8px;background:rgba(0,0,0,.14);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--notice-ink);transform-origin:left;transition:background .2s}
.timer.low i{background:var(--alert)}
.answer{display:flex;gap:8px}
.answer input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 12px;border:2px solid var(--notice-ink);border-radius:4px;background:#fffdf2;color:#1a1a12}
.answer .btn{padding:12px 16px}
.meta{display:flex;justify-content:space-between;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;font-weight:600;font-size:14px}
.stamp{align-self:flex-start;border:3px solid currentColor;border-radius:6px;padding:6px 12px;font-family:var(--display);font-weight:900;font-stretch:115%;text-transform:uppercase;letter-spacing:.06em;font-size:20px;transform:rotate(-3deg);background:var(--card)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:thud .28s ease-out}}
@keyframes thud{from{transform:rotate(-3deg) scale(1.6);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
.reveal{display:flex;flex-direction:column;gap:10px}
.reveal .pts{font-family:var(--display);font-weight:900;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.reveal .pts span{font-size:16px;font-weight:600;color:var(--muted);font-family:var(--body)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{font-size:13px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);background:var(--paper)}
.results{display:flex;flex-direction:column}
.results>div{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.results>div:first-child{border-top:0}
.results b{display:block;font-weight:600}
.results .q{font-size:13px;color:var(--muted)}
.big{font-family:var(--display);font-weight:900;font-stretch:105%;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.big span{font-size:20px;color:var(--muted);font-weight:700}
.board{display:flex;flex-direction:column;gap:2px;font-size:15px}
.board>div{display:grid;grid-template-columns:26px 1fr auto;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.board>div.me{font-weight:700}
.board>div:first-child{border-top:0}
.sharebox{white-space:pre;font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--paper);border:1px dashed var(--line);border-radius:4px;padding:10px;overflow-x:auto}
.foot{font-size:12px;color:var(--muted);text-align:center}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.err{color:var(--alert);font-weight:600}
</style>
</head>

function norm(s){
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/&/g,' and ').replace(/['’.,]/g,'').replace(/[^a-z0-9]+/g,' ').trim()

}
function strip(s){
  let prev;

    s = s.replace(/^(the|london borough of|royal borough of|metropolitan borough of|borough of|city and county of|city of|county of|district of)\s+/,'')
         .replace(/\s+(metropolitan borough council|metropolitan district council|county council|borough council|district council|city council|council|metropolitan borough|borough|district|unitary authority|unitary|county)$/,'');
  } while (s !== prev && s.length);

const KEYS = [...INDEX.keys()];
function lev(a, b){
  const m = a.length, n = b.length; if (Math.abs(m-n) > 2) return 9;
  let prev = Array.from({length:n+1}, (_, j) => j);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));

  }

}
function lookup(text){
  const n = norm(text); if (!n) return [];
  if (INDEX.has(n)) return INDEX.get(n);
  const s = strip(n); if (INDEX.has(s)) return INDEX.get(s);
  const tol = s.length <= 4 ? 0 : s.length <= 7 ? 1 : 2;
  if (!tol) return [];
  let best = [], bd = 99;
  for (const k of KEYS){
    if (k.length < 4) continue;
    const d = lev(s, k);
    if (d < bd){ bd = d; best = [...INDEX.get(k)]; }
    else if (d === bd) INDEX.get(k).forEach(c => { if(!best.includes(c)) best.push(c); });
  }
  return bd <= tol ? best : [];
}

const ROUND_CACHE = {};
function dayStr(ms){ return new Date(ms).toISOString().slice(0, 10); }
function roundTexts(date){
  if (ROUND_CACHE[date]) return ROUND_CACHE[date];
  if (date < NEW_FROM) return (ROUND_CACHE[date] = makeRound(rng(hashStr('councillion-' + date))));
  const recent = new Set();
  for (let k = 1; k <= 4; k++){ const d = dayStr(Date.parse(date) - k*864e5); if (d >= LAUNCH) roundTexts(d).forEach(p => recent.add(p.text)); }

    if (out.length === 7) break;
    const fresh = GROUPS2[g].filter(p => !recent.has(p.text));
    if (fresh.length) out.push(prepare(fresh[Math.floor(r()*fresh.length)]));

}

const TIERS = [

const tierFor = share => TIERS.findIndex(t => share >= t.min);
const TITLES = [[560,'Leader of the Council'],[440,'Cabinet Member'],[320,'Ward Councillor'],[200,'Parish Clerk'],[0,'Member of the Public']];

  set(k, v){ try { localStorage.setItem('councillion:' + k, JSON.stringify(v)); } catch(e){} }
};

function crowdShare(i, name){
  if (S.mode !== 'daily') return null;
  const others = crowd.plays.filter(p => p.id !== crowd.uid && Array.isArray(p.answers) && p.answers[i]);
  if (!others.length) return null;
  return { n: others.length, count: others.filter(p => p.answers[i] === name).length };
}

function evaluate(i, text){
  const p = S.prompts[i];
  const res = { input: text || '', name:'', tier:-1, pts:0, share:null, reason:'' };
  if (!text){ res.reason = 'Time ran out.'; return res; }
  const hits = lookup(text);
  const ok = hits.find(c => p.valid.includes(c));
  if (!ok){
    if (hits.length){
      const c = hits[0];
      res.reason = `${c.name} is a ${TYPE_LABEL[c.t]}${c.area && c.t !== 'UA' ? ' in ' + c.area : ''}, so it doesn’t count here.`;
      if (c.t === 'SG' && p.text.includes('London borough')) res.reason = 'The City of London is a one-off authority, not a London borough.';
    } else res.reason = 'That isn’t a council name I recognise.';
    return res;
  }
  res.name = ok.name;
  const base = WEIGHT[ok.f-1] / p.total;
  const cs = crowdShare(i, ok.name);
  res.share = cs ? (cs.count + K*base) / (cs.n + K) : base;
  res.crowdN = cs ? cs.n : 0;
  res.tier = tierFor(res.share);
  res.pts = TIERS[res.tier].pts;
  return res;
}

async function initCrowd(){
  try {
    const [db, user] = await Promise.all([window.claude?.use?.('db'), window.claude?.use?.('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    crowd.db = db; crowd.user = user; crowd.uid = uid;
    const w = await user.can?.('data.write'); if (w === false) crowd.canWrite = false;
    const timer = setTimeout(() => { if (!crowd.ready){ crowd.ready = 'slow'; refreshBoard(); } }, 10000);
    db.collection('plays').where('date', '==', TZ_TODAY).onSnapshot(snap => {
      clearTimeout(timer);
      crowd.plays = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      crowd.ready = true; refreshBoard();
    }, () => { clearTimeout(timer); crowd.ready = 'error'; refreshBoard(); });
  } catch(e){}
}

  if (!crowd.db || !crowd.canWrite || S.mode !== 'daily') return;
  const body = { date: TZ_TODAY, answers: S.results.map(r => r.name || ''), points: S.results.map(r => r.pts),

  const done = crowd.plays.filter(p => p.done).sort((a, b) => b.score - a.score);
  if (!done.length) return `<section class="panel"><h3>Today’s chamber</h3><p class="muted small">Nobody has finished today’s agenda yet. Finish first and you top the table.</p></section>`;
  let names = {};

function examples(p, chosen){
  const pool = p.valid.filter(c => c.name !== chosen);
  const minF = Math.min(...pool.map(c => c.f));
  const rare = shuffle(pool.filter(c => c.f <= minF + 0), Math.random).slice(0, 4);
  const common = p.valid.slice().sort((a, b) => b.f - a.f)[0];
  return { rare, common };
}

           <p class="small" style="margin:0">About ${pct} of players would say ${esc(r.name)}.${r.crowdN ? ` Based on ${r.crowdN} other player${r.crowdN === 1 ? '' : 's'} today plus an estimate.` : ''}</p>`
        : `<div class="stamp" style="color:var(--alert)">${text ? 'Rejected' : 'No answer'}</div>
           <div class="pts">+0 <span>${text ? 'for “' + esc(text) + '”' : ''}</span></div>
           <p class="small" style="margin:0">${esc(r.reason)}</p>`}
    <div>
      <p class="small muted" style="margin:0 0 6px">Rarer answers you could have given</p>
      <div class="picks">${ex.rare.map(c => `<span class="pick">${esc(c.name)}</span>`).join('')}</div>
      <p class="small muted" style="margin:8px 0 0">Most common answer: <b>${esc(ex.common.name)}</b></p>
    </div>
    <button class="btn" id="next">${i === 6 ? 'See the minutes' : 'Next item'}</button>
  </section>`;
  const nb = document.getElementById('next'); nb.focus();
  nb.onclick = () => { S.idx++; if (S.idx < 7) showPrompt(); else finish(); };
}

function finish(){
  stopTimer();
  const total = S.results.reduce((s, r) => s + r.pts, 0);
  const title = TITLES.find(t => total >= t[0])[1];
  if (S.mode === 'daily'){
    const st = store.get('streak', {n:0, last:''});
    if (st.last !== TZ_TODAY){
      const y = new Date(Date.parse(TZ_TODAY) - 864e5).toISOString().slice(0, 10);
      store.set('streak', {n: st.last === y ? st.n + 1 : 1, last: TZ_TODAY});
    }
  }
  const grid = S.results.map(r => r.tier >= 0 ? TIERS[r.tier].sq : '⬛').join('');
  const share = `Councillion #${DAY_NO}\n${grid}\n${total}/700 · ${title}`;
  app.innerHTML = `${mast()}
  <section class="notice">
    <div class="notice-head"><span>${S.mode === 'daily' ? 'Minutes of agenda #' + DAY_NO : 'Practice minutes'}</span><span>${new Date(TZ_TODAY).toLocaleDateString('en-GB', {day:'numeric', month:'short'})}</span></div>
    <div class="notice-body">
      <div class="big">${total}<span> / 700</span></div>
      <h2 style="font-size:24px">${title}</h2>
    </div>
  </section>
  <section class="panel">
    <h3>Your answers</h3>
    <div class="results">${S.results.map((r, i) => `<div><span class="chip" style="margin-top:4px;background:${r.tier >= 0 ? TIERS[r.tier].col : 'var(--alert)'}"></span><span><span class="q">${esc(S.prompts[i].text)}</span><b>${r.name ? esc(r.name) + ' · ' + TIERS[r.tier].name : (r.input ? '“' + esc(r.input) + '” · rejected' : 'No answer')}</b></span><span class="num">${r.pts}</span></div>`).join('')}</div>
  </section>
  ${S.mode === 'daily' ? `<section class="panel"><h3>Share</h3><div class="sharebox" id="sharetext">${esc(share)}</div><div class="row"><button class="btn" id="copy">Copy result</button></div><p class="small muted" id="copied" style="margin:0"></p></section><div id="board"></div>` : ''}
  <div class="row">
    <button class="btn ghost" id="again">Play a practice round</button>
    <button class="btn ghost" id="homeb">Noticeboard</button>
  </div>
  <p class="foot">${S.mode === 'daily' ? 'A new agenda is posted at midnight, UK time.' : ''}</p>`;
  const cp = document.getElementById('copy');
  if (cp) cp.onclick = async () => {
    const msg = document.getElementById('copied');
    try { await navigator.clipboard.writeText(share); msg.textContent = 'Copied. Paste it anywhere.'; }
    catch(e){ msg.textContent = 'Copying isn’t allowed here. Select the text above and copy it.'; }
  };
  document.getElementById('again').onclick = () => { S = {mode:'practice', prompts:practiceRound(), results:[], idx:0}; showPrompt(); };
  document.getElementById('homeb').onclick = () => home();
  refreshBoard();
}

home();
initCrowd();
// A new agenda goes up at midnight UK time: if the page was left open overnight, load it when the player comes back.
function checkNewDay(){
  const now = new Date().toLocaleDateString('en-CA', {timeZone:'Europe/London'});
  if (now !== TZ_TODAY && !tick) location.reload();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNewDay(); });
setInterval(checkNewDay, 60000);
</script>
</body>
</html>
